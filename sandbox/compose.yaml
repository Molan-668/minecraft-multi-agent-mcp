services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: mc_server_${SAVE_NAME:-myworld}
    hostname: mc_server_${SAVE_NAME:-myworld}
    ports:
      - "${HOST_IP:-0.0.0.0}:${HOST_PORT:-25565}:25565"
    environment:
      TYPE: ${TYPE:-VANILLA}
      EULA: "TRUE"
      VERSION: ${VERSION:-1.21.11}
      LEVEL: ${SAVE_NAME:-myworld}
      SEED: ${SEED:-}
      MODE: ${MODE:-survival}
      FORCE_GAMEMODE: ${FORCE_GAMEMODE:-true}
      DIFFICULTY: ${DIFFICULTY:-peaceful}
      HARDCORE: ${HARDCORE:-false}
      MAX_BUILD_HEIGHT: ${MAX_BUILD_HEIGHT:-320}
      SPAWN_PROTECTION: ${SPAWN_PROTECTION:-0}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-10}
      LEVEL_TYPE: ${LEVEL_TYPE:-minecraft:normal}
      ONLINE_MODE: ${ONLINE_MODE:-false}
      MEMORY: ${MEMORY:-1G}
      OPS: ${OPS}
      DEBUG: ${DEBUG:-false}
      ENABLE_RCON: ${ENABLE_RCON:-false}
      RCON_PASSWORD: ${RCON_PASSWORD:-minecraft}
    # allows tty for colored output and interactive programs inside
    # keeps stdin open for user input
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ${LOCAL_FOLDER:-./minecraft_data}:/data
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20
